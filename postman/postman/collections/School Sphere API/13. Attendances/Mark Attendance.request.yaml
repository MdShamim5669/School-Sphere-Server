$kind: http-request
url: "{{baseUrl}}/api/v1/attendances"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "date": "2026-09-01T00:00:00.000Z",
      "present": true,
      "studentId": "c5c2f417-38b2-4a8e-a227-d5d528e971ec",
      "lessonId": "da7d15ed-4262-4943-b171-98712441b762"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('attendanceId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
