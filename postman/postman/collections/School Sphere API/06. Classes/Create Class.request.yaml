$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "10-A",
      "capacity": 30,
      "gradeId": "{{gradeId}}",
      "supervisorId": "{{teacherId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('classId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
