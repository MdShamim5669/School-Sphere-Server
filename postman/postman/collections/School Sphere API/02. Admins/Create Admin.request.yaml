$kind: http-request
url: "{{baseUrl}}/admins"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin2",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('adminId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
