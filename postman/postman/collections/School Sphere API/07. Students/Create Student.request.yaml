$kind: http-request
url: "{{baseUrl}}/api/v1/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |
    {
      "username": "student_alex",
      "password": "Password123!",
      "name": "Alex",
      "surname": "Smith",
      "email": "alex.smith@example.com",
      "phone": "+1987654322",
      "address": "456 Oak Street, Springfield",
      "bloodType": "A_POSITIVE",
      "sex": "MALE",
      "birthday": "2008-09-20",
      "parentId": "f2b8558e-1291-44cf-9bf8-15f9aa004c51",
      "classId": "5d70be5d-64a9-48a7-a936-b8679a157d7c",
      "gradeId": "f67bdb59-1e59-49e2-b309-85bb71714fd1"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('studentId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
