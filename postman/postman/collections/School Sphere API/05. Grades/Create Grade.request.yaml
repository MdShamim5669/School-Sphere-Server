$kind: http-request
url: "{{baseUrl}}/api/v1/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "level": 30
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('gradeId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
