$kind: http-request
url: "{{baseUrl}}/lessons"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Algebra 101",
      "day": "MONDAY",
      "startTime": "2026-09-01T09:00:00.000Z",
      "endTime": "2026-09-01T10:00:00.000Z",
      "subjectId": "973b4b30-ae04-4350-ba7c-7d9178ee6c10",
      "classId": "5d70be5d-64a9-48a7-a936-b8679a157d7c",
      "teacherId": "72bc9429-99f0-4cae-81e6-f679c1de8077"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data && res.data.id) {
              pm.environment.set('lessonId', res.data.id);
          }
      }
    language: text/javascript
order: 1000
